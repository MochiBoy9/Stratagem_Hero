<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stratagem Hero Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="stageFrame" class="game-container"> 
        
        <!-- HUD Elements -->
        <div class="hud">
            <div>Wave: <span id="wave">1</span></div>
            <div>Time: <span id="time">10</span></div>
            <div>Score: <span id="score">0</span></div>
            <div>Combo: <span id="combo">0</span></div>
            <div>Cleared: <span id="cleared">0</span></div>
        </div>

        <div class="wave-timer-track">
            <div id="waveTimerFill" class="wave-timer-fill"></div>
        </div>

        <!-- Mode: Stratagem Hero / Critical Inputs -->
        <div id="heroContainer" class="mode-container active-mode">
            <div id="categoryBadge" class="category-badge">Category</div>
            <div id="stratagemIconWrap" class="stratagem-icon-wrap">
                <img id="stratagemIcon" class="stratagem-icon" alt="" />
                <div id="stratagemIconFallback" class="stratagem-icon-fallback">?</div>
            </div>
            <h2 id="stratagemName">Stratagem Name</h2>
            <div id="arrow-container" class="arrows"></div>
            <div class="next-preview-container">
                <div class="next-item hidden" id="next1">
                    <img class="preview-icon" id="next1Icon" alt="" />
                    <span id="next1Name"></span>
                </div>
                <div class="next-item hidden" id="next2">
                    <img class="preview-icon" id="next2Icon" alt="" />
                    <span id="next2Name"></span>
                </div>
            </div>
        </div>

        <!-- Mode: Combat QTE -->
        <div id="qteContainer" class="mode-container">
            <h3 id="qtePrompt" style="color: #ff4444; margin: 0 0 10px 0;">Warning: Heavy Armor Detected!</h3>
            <div id="qteButtons" style="display:flex; flex-direction:column; gap:8px; width:100%;"></div>
        </div>

        <!-- Mode: Grid Targeting -->
        <div id="gridContainer" class="mode-container">
            <h2 id="gridPrompt" style="margin: 0 0 10px 0;">Target: C3</h2>
            <div id="gridBoard" class="grid-board"></div>
        </div>

        <!-- Mode: Automaton Decoder -->
        <div id="decoderContainer" class="mode-container">
            <h3 style="color: #ff4444; margin: 0 0 15px 0;">DECODE CIPHER</h3>
            <div id="decoderBoard" class="decoder-board"></div>
        </div>

        <!-- Mode: Pump Control (Pipes) -->
        <div id="pipeContainer" class="mode-container">
            <h3 style="color: #44ff44; margin: 0 0 10px 0;">ALIGN FLOW</h3>
            <div id="pipeBoard" class="pipe-board"></div>
        </div>
        
        <!-- Global D-Pad -->
        <div id="dpad" class="dpad">
            <button class="dpad-btn" data-dir="up">W</button>
            <div class="dpad-row">
                <button class="dpad-btn" data-dir="left">A</button>
                <button class="dpad-btn" data-dir="down">S</button>
                <button class="dpad-btn" data-dir="right">D</button>
            </div>
        </div>

        <!-- Main Menu Overlay -->
        <div id="mainMenuOverlay" class="overlay">
            <h1 style="margin: 0 0 5px 0;">SUPER EARTH OS</h1>
            <p style="margin: 0 0 15px 0; font-size: 0.85em; color: #aaa;"><span id="totalCount">0</span> Stratagems Loaded</p>
            
            <div class="highscore-panel">
                <div>Hero: <span id="hsHero">0</span> | QTE: <span id="hsQTE">0</span> | Critical: <span id="hsCritical">0</span></div>
                <div>Grid: <span id="hsGrid">0</span> | Decode: <span id="hsDecoder">0</span> | Pump: <span id="hsPipes">0</span></div>
            </div>

            <div class="menu-grid">
                <button class="menu-btn" data-mode="hero">Stratagem Hero</button>
                <button class="menu-btn" data-mode="critical">Critical Inputs</button>
                <button class="menu-btn" data-mode="qte">Combat QTE</button>
                <button class="menu-btn" data-mode="grid">Grid Targeting</button>
                <button class="menu-btn" data-mode="decoder">Automaton Decoder</button>
                <button class="menu-btn" data-mode="pipes">Pump Control</button>
            </div>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameOverOverlay" class="overlay hidden">
            <h1>Game Over</h1>
            <p>Score: <span id="finalScore">0</span></p>
            <p>Stage Reached: <span id="finalWave">1</span></p>
            <button id="restartBtn">Retry Mode</button>
            <button id="menuBtn" style="background:#444; color:#fff;">Main Menu</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
