<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stratagem Hero Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="stageFrame" class="game-container"> 
        
        <!-- HUD Elements -->
        <div class="hud">
            <div>Wave: <span id="wave">1</span></div>
            <div>Time: <span id="time">10</span></div>
            <div>Score: <span id="score">0</span></div>
            <div>Combo: <span id="combo">0</span></div>
            <div>Cleared: <span id="cleared">0</span></div>
            <div>Best: <span id="sessionBest">0</span></div>
        </div>

        <div class="wave-timer-track">
            <div id="waveTimerFill" class="wave-timer-fill"></div>
        </div>

        <!-- Current Stratagem Info -->
        <div id="categoryBadge" class="category-badge">Category</div>

        <div id="stratagemIconWrap" class="stratagem-icon-wrap">
            <img id="stratagemIcon" class="stratagem-icon" alt="" />
            <div id="stratagemIconFallback" class="stratagem-icon-fallback">?</div>
        </div>

        <h2 id="stratagemName">Stratagem Name</h2>

        <div id="arrow-container" class="arrows"></div>

        <!-- Next Stratagem Previews -->
        <div class="next-preview-container">
            <div class="next-item hidden" id="next1">
                <img class="preview-icon" id="next1Icon" alt="" />
                <span id="next1Name"></span>
            </div>
            <div class="next-item hidden" id="next2">
                <img class="preview-icon" id="next2Icon" alt="" />
                <span id="next2Name"></span>
            </div>
        </div>
        
        <!-- D-Pad -->
        <div id="dpad" class="dpad">
            <button class="dpad-btn" data-dir="up">W</button>
            <div class="dpad-row">
                <button class="dpad-btn" data-dir="left">A</button>
                <button class="dpad-btn" data-dir="down">S</button>
                <button class="dpad-btn" data-dir="right">D</button>
            </div>
        </div>

        <!-- Idle Menu Overlay -->
        <div id="idleOverlay" class="overlay">
            <h1>Stratagem Hero</h1>
            <p><span id="totalCount">0</span> Stratagems Loaded!</p>
            <button id="startBtn">Start Game</button>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameOverOverlay" class="overlay hidden">
            <h1>Game Over</h1>
            <p>Score: <span id="finalScore">0</span></p>
            <p>Wave Reached: <span id="finalWave">1</span></p>
            <p>Max Combo: <span id="finalCombo">0</span></p>
            <p>Cleared: <span id="finalCleared">0</span></p>
            <p>Session Best: <span id="finalSessionBest">0</span></p>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
